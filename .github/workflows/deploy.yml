name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove repository metadata
        shell: bash
        run: rm -rf .git .github

      - name: Upload application
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          rm: false

      - name: Install, migrate, and build
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_RESTART_COMMAND: ${{ secrets.DEPLOY_RESTART_COMMAND }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_RESTART_COMMAND
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            for env_file in .env .env.local .env.production .env.production.local; do
              if [ -f "$env_file" ]; then
                set -a
                . "$env_file"
                set +a
              fi
            done
            export PORT=3005
            test -n "${DATABASE_URL:-}" || {
              echo "DATABASE_URL is missing from the server environment files"
              exit 1
            }
            npm ci
            node -e 'const mysql = require("mysql2/promise"); const url = new URL(process.env.DATABASE_URL); console.log(`Checking MySQL ${url.hostname}:${url.port || 3306}/${url.pathname.slice(1)}`); mysql.createConnection(process.env.DATABASE_URL).then(async connection => { await connection.query("SELECT 1"); await connection.end(); console.log("MySQL connection succeeded"); }).catch(error => { console.error(`MySQL connection failed: ${error.code || "unknown"} ${error.message}`); process.exit(1); });'
            npm run db:push
            npm run build
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            if [ -d public ]; then cp -r public .next/standalone/; fi
            if [ -n "$DEPLOY_RESTART_COMMAND" ]; then
              eval "$DEPLOY_RESTART_COMMAND"
            fi