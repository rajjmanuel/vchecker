name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix git permissions for tar
        run: chmod -R +r .git 2>/dev/null || true

      - name: Upload application (SCP - no server git auth needed)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "src,drizzle,public,package.json,package-lock.json,next.config.ts,drizzle.config.ts,tsconfig.json,postcss.config.mjs,eslint.config.mjs,.github,README.md,next-env.d.ts"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          rm: false
          strip_components: 0

      - name: Install, migrate, build and PM2
        uses: appleboy/ssh-action@v1.2.2
        env:
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME || 'vchecker' }}
          APP_PORT: ${{ secrets.APP_PORT || '3005' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PM2_APP_NAME,APP_PORT,DEPLOY_PATH
          script: |
            set -e
            echo ">>> Deploy to $DEPLOY_PATH on $(hostname)"
            cd "$DEPLOY_PATH"

            # Optional: keep git history in sync without needing token (update remote HEAD to match uploaded files)
            # We use SCP upload, so no git fetch needed. If you want git log to reflect deploys, uncomment:
            # git rev-parse --short HEAD 2>/dev/null || true

            # 1. Load server env
            for env_file in .env .env.local .env.production .env.production.local; do
              if [ -f "$env_file" ]; then
                echo ">>> Found $env_file"
                set -a
                . "$env_file"
                set +a
              fi
            done
            export PORT="$APP_PORT"
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "ERROR: DATABASE_URL missing in .env/.env.local/.env.production"
              exit 1
            fi
            echo ">>> PORT=$PORT DB=$(echo $DATABASE_URL | sed -E 's|.*@.*:.*/([^?]*).*|\1|')"

            # 2. Node / PM2
            echo ">>> Node $(node -v) NPM $(npm -v)"
            if ! command -v pm2 >/dev/null 2>&1; then
              npm install -g pm2
            fi

            # 3. Install + migrate + build
            echo ">>> npm ci"
            npm ci

            echo ">>> DB migrate"
            if [ -d drizzle ] && [ -f drizzle/meta/_journal.json ]; then
              npm run db:migrate
            else
              npm run db:push
            fi

            echo ">>> npm run build"
            npm run build

            # 4. Standalone
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            if [ -d public ]; then cp -r public .next/standalone/; fi
            for env_file in .env.production .env.local .env; do
              if [ -f "$env_file" ]; then
                cp "$env_file" .next/standalone/.env
                echo ">>> Copied $env_file -> .next/standalone/.env"
                break
              fi
            done

            # 5. PM2
            if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
              echo ">>> Reload $PM2_APP_NAME"
              PORT="$PORT" pm2 reload "$PM2_APP_NAME" --update-env
            else
              echo ">>> Start $PM2_APP_NAME"
              PORT="$PORT" pm2 start .next/standalone/server.js --name "$PM2_APP_NAME"
            fi
            pm2 save
            pm2 list

            # 6. Health
            echo ">>> Health http://127.0.0.1:$PORT/api/health"
            for i in 1 2 3 4 5; do
              if curl -fsS "http://127.0.0.1:$PORT/api/health" | grep -q '"ok":true'; then
                echo ">>> Health OK"
                break
              fi
              echo "retry $i/5..."; sleep 2
              if [ "$i" = 5 ]; then echo "WARN: health failed - pm2 logs $PM2_APP_NAME --lines 50"; fi
            done
            echo ">>> Done"
