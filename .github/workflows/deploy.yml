name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove repository metadata
        shell: bash
        run: rm -rf .git .github

      - name: Upload application
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "."
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          rm: false

      - name: Install, migrate, build, and run PM2
        uses: appleboy/ssh-action@v1.2.2
        env:
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME || 'nextjs-app' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PM2_APP_NAME
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            # 1. Load server environment files
            for env_file in .env .env.local .env.production .env.production.local; do
              if [ -f "$env_file" ]; then
                set -a
                . "$env_file"
                set +a
              fi
            done

            export PORT=3005
            test -n "${DATABASE_URL:-}" || {
              echo "DATABASE_URL is missing from the server environment files"
              exit 1
            }

            # 2. Install dependencies, run database migrations, and build
            npm ci
            npm run db:push
            npm run build

            # 3. Setup Next.js Standalone build structure
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            if [ -d public ]; then cp -r public .next/standalone/; fi

            # 4. Copy runtime environment file into standalone directory
            for env_file in .env.production .env.local .env; do
              if [ -f "$env_file" ]; then
                cp "$env_file" .next/standalone/.env
                break
              fi
            done

            # 5. Manage PM2 instance
            if pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then
              echo "Reloading existing PM2 process: $PM2_APP_NAME"
              PORT=$PORT pm2 reload "$PM2_APP_NAME" --update-env
            else
              echo "Starting new PM2 process: $PM2_APP_NAME"
              PORT=$PORT pm2 start .next/standalone/server.js --name "$PM2_APP_NAME"
            fi

            # 6. Persist PM2 process state across system reboots
            pm2 save