name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fix git permissions for tar
        run: chmod -R +r .git 2>/dev/null || true

      - name: Upload application (SCP - no server git auth needed)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "src,drizzle,public,package.json,package-lock.json,next.config.ts,drizzle.config.ts,tsconfig.json,postcss.config.mjs,eslint.config.mjs,.github,README.md,next-env.d.ts"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          rm: false
          strip_components: 0

      - name: Install, migrate, build and PM2
        uses: appleboy/ssh-action@v1.2.2
        env:
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME || 'vchecker' }}
          APP_PORT: ${{ secrets.APP_PORT || '3005' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: PM2_APP_NAME,APP_PORT,DEPLOY_PATH
          script: |
            set -e
            echo ">>> Deploy to $DEPLOY_PATH on $(hostname)"
            cd "$DEPLOY_PATH"

            # Optional: keep git history in sync without needing token (update remote HEAD to match uploaded files)
            # We use SCP upload, so no git fetch needed. If you want git log to reflect deploys, uncomment:
            # git rev-parse --short HEAD 2>/dev/null || true

            # 1. Load server env
            for env_file in .env .env.local .env.production .env.production.local; do
              if [ -f "$env_file" ]; then
                echo ">>> Found $env_file"
                set -a
                . "$env_file"
                set +a
              fi
            done
            export PORT="$APP_PORT"
            if [ -z "${DATABASE_URL:-}" ]; then
              echo "ERROR: DATABASE_URL missing in .env/.env.local/.env.production"
              exit 1
            fi
            echo ">>> PORT=$PORT DB=$(echo $DATABASE_URL | sed -E 's|.*@.*:.*/([^?]*).*|\1|')"

            # 2. Node / PM2 (no Docker, PM2 standalone only)
            echo ">>> Node $(node -v) NPM $(npm -v)"
            export PATH="$HOME/.npm-global/bin:$PATH"
            if ! command -v pm2 >/dev/null 2>&1; then
              echo ">>> pm2 not found, installing to user prefix (no sudo needed)..."
              mkdir -p "$HOME/.npm-global"
              npm config set prefix "$HOME/.npm-global" 2>/dev/null || true
              npm install -g pm2
              export PATH="$HOME/.npm-global/bin:$PATH"
              # ensure future shells find pm2
              echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.bashrc 2>/dev/null || true
              echo 'export PATH="$HOME/.npm-global/bin:$PATH"' >> ~/.profile 2>/dev/null || true
            fi
            pm2 --version || { echo "pm2 still not found, trying npx"; npx pm2 --version; }

            # 3. Install + migrate + build
            echo ">>> npm ci"
            npm ci

            echo ">>> DB migrate (no Docker, PM2 only) - best effort, don't fail deploy if tables exist"
            set +e
            if [ -d drizzle ] && [ -f drizzle/meta/_journal.json ]; then
              echo ">>> Trying migrate (expected to fail if DB was created via push)"
              npm run db:migrate 2>&1 | tee /tmp/migrate.log; MIGRATE_STATUS=${PIPESTATUS[0]}
              cat /tmp/migrate.log | tail -30
              if [ $MIGRATE_STATUS -ne 0 ]; then
                echo ">>> migrate exit $MIGRATE_STATUS, trying push --force (non-interactive)"
                npx drizzle-kit push --force 2>&1 | tee /tmp/push.log | tail -50
                PUSH_STATUS=${PIPESTATUS[0]}
                cat /tmp/push.log | tail -30
                if [ $PUSH_STATUS -ne 0 ]; then
                  echo ">>> push also failed (likely schema already in sync or DB connection), continuing anyway"
                  echo ">>> DB host: $(echo $DATABASE_URL | sed -E 's|.*@([^:/]+).*|\1|') port check:"
                  mysql -e "SHOW TABLES;" 2>&1 | head -20 || echo "mysql client check failed, but continuing to build"
                else
                  echo ">>> push succeeded"
                fi
              else
                echo ">>> migrate succeeded"
              fi
            else
              echo ">>> No journal, trying push --force"
              npx drizzle-kit push --force 2>&1 | tail -30 || echo "push failed, continuing"
            fi
            set -e
            echo ">>> DB step done (best effort)"

            echo ">>> npm run build"
            npm run build

            # 4. Standalone
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
            if [ -d public ]; then cp -r public .next/standalone/; fi
            for env_file in .env.production .env.local .env; do
              if [ -f "$env_file" ]; then
                cp "$env_file" .next/standalone/.env
                echo ">>> Copied $env_file -> .next/standalone/.env"
                break
              fi
            done

            # 5. PM2
            if pm2 describe "$PM2_APP_NAME" >/dev/null 2>&1; then
              echo ">>> Reload $PM2_APP_NAME"
              PORT="$PORT" pm2 reload "$PM2_APP_NAME" --update-env
            else
              echo ">>> Start $PM2_APP_NAME"
              PORT="$PORT" pm2 start .next/standalone/server.js --name "$PM2_APP_NAME"
            fi
            pm2 save
            pm2 list

            # 6. Health
            echo ">>> Health http://127.0.0.1:$PORT/api/health"
            for i in 1 2 3 4 5; do
              if curl -fsS "http://127.0.0.1:$PORT/api/health" | grep -q '"ok":true'; then
                echo ">>> Health OK"
                break
              fi
              echo "retry $i/5..."; sleep 2
              if [ "$i" = 5 ]; then echo "WARN: health failed - pm2 logs $PM2_APP_NAME --lines 50"; fi
            done
            echo ">>> Done"
